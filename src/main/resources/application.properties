spring.application.name=Consumer
server.port=8081

#Kafka - configurations
#Consumer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=group-1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.football.football.DomainLayer.DTO.MatchCommentDTOs

#Couchbase - configurations
spring.couchbase.bootstrap-host=127.0.0.1
spring.couchbase.bucket.name=football.manager.userMatchComments
spring.couchbase.bucket.password=Administrator
spring.data.couchbase.auto-index=true
spring.couchbase.username=Administrator
spring.couchbase.password=Administrator
spring.couchbase.connection-string=couchbase://localhost
spring.data.couchbase.bucket-name=football.manager.userMatchComments
